name: Build Linux app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub Release with the Linux build"
        type: boolean
        default: false

# Allow the workflow to create/update releases.
permissions:
  contents: write

jobs:
  linux:
    name: Build Pike (Linux x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system libraries for Qt WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-xfixes0 libnss3 libasound2 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxi6 libfontconfig1 libdbus-1-3

      - name: Install application + build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pywebview[qt]" "pyinstaller>=6.0.0"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python -c "import re,pathlib; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', pathlib.Path('config.py').read_text()).group(1))")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Build the Linux executable
        run: python build_exe.py

      - name: Smoke test the executable
        run: |
          set -euo pipefail
          ./dist/Pike --server --port 8799 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            sleep 1
            if curl -fsS http://127.0.0.1:8799/healthz >/dev/null 2>&1; then
              echo "Health check passed."
              exit 0
            fi
          done
          echo "Pike did not become healthy in time." >&2
          exit 1

      - name: Package the Linux build
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p package
          cp dist/Pike package/Pike
          cp packaging/linux/README.txt package/README.txt
          cp packaging/linux/install.sh package/install.sh
          chmod +x package/Pike package/install.sh
          tar -C package -czf "Pike-${VERSION}-Linux-x86_64.tar.gz" .
          ls -lh "Pike-${VERSION}-Linux-x86_64.tar.gz"

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Pike-Linux
          path: Pike-*-Linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pike v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: Pike-*-Linux-x86_64.tar.gz
          fail_on_unmatched_files: true
