<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ url_for('index') }}" aria-label="Pike home">
      <span class="brand-logo">{% with logo_size = 30 %}{% include "partials/logo.html" %}{% endwith %}</span>
      <span class="brand-name">Pike</span>
      <span class="brand-version">v{{ product.version }}</span>
    </a>

    <button class="nav-toggle" id="nav-toggle" type="button"
            aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <nav class="primary-nav" id="primary-nav" aria-label="Primary">
      {% for link in nav_links %}
        <a class="nav-link {{ 'is-active' if page == link.endpoint else '' }}"
           href="{{ url_for(link.endpoint) }}">{{ link.label }}</a>
      {% endfor %}
    </nav>

    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" type="button"
              aria-label="Toggle colour theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" class="icon icon-moon" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg viewBox="0 0 24 24" class="icon icon-sun" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <a class="btn btn-primary btn-sm header-cta" href="{{ url_for('download') }}">Download</a>
      {% if account_user %}
        <a class="btn btn-ghost btn-sm header-account" href="{{ url_for('account.dashboard') }}" title="Open your dashboard">
          <span class="avatar" aria-hidden="true">{{ (account_user.name or account_user.email)[0]|upper }}</span>
          <span class="header-account-label">Dashboard</span>
        </a>
      {% else %}
        <a class="btn btn-ghost btn-sm header-account" href="{{ url_for('account.login') }}">Sign in</a>
      {% endif %}
    </div>
  </div>
</header>
