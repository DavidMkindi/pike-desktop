{% extends "base.html" %}

{% block content %}
<section class="section error-page">
  <div class="container">
    <p class="error-code">{{ code }}</p>
    <h1 class="page-title">{{ message }}</h1>
    <p class="section-lede">{{ detail }}</p>
    <div class="hero-actions center">
      <a class="btn btn-primary btn-lg" href="{{ url_for('index') }}">
        Back to home
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg>
      </a>
      <a class="btn btn-ghost btn-lg" href="{{ url_for('docs') }}">Open the docs</a>
    </div>
  </div>
</section>
{% endblock %}
