<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Pike">
  <style>
    /* Pure black on light, pure white on dark — no other colours. */
    svg { color: #000000; }
    @media (prefers-color-scheme: dark) { svg { color: #ffffff; } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- monitor -->
    <rect x="12" y="20" width="72" height="46" rx="5"/>
    <!-- stand -->
    <path d="M48 66v11"/>
    <path d="M31 77h34"/>
    <!-- writing stroke -->
    <path d="M34 57c9-2.5 16 3.5 26-2" stroke-width="4"/>
    <!-- pen body -->
    <path d="M40.5 51 58.5 33 53.5 28 35.5 46z"/>
    <!-- nib -->
    <path d="M32.5 54 40.5 51 35.5 46z" fill="currentColor"/>
    <!-- slit -->
    <path d="M35 51.6 38.2 48.4"/>
  </g>
</svg>